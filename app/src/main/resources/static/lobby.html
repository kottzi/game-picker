<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лобби — Game Picker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top-bar">
    <a class="wordmark" href="/">GAME PICKER</a>
    <div class="top-bar-right">
        <span id="user-slot"></span>
        <button class="theme-toggle" id="logout-btn" title="Выйти из Steam" aria-label="Выйти из Steam" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </button>
        <button class="theme-toggle" data-theme-toggle aria-label="Переключить тему">☾</button>
    </div>
</header>
<main class="container">
    <div id="page-error"></div>
    <div id="lobby-header"></div>
    <div id="content"></div>
</main>
<footer class="site-footer">
    <span>© kottzi</span>
    <span id="app-version"></span>
</footer>
<script type="module" src="/js/app.js"></script>
<script type="module" src="/js/lobby.js"></script>
</body>
</html>
