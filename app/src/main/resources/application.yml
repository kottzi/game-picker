spring:
  application:
    name: game-picker

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:game-picker}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: game-picker-pool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}

steam:
  api-key: ${STEAM_API_KEY}
  catalog:
    app-list-refresh-cron: ${STEAM_APP_LIST_CRON:0 0 4 * * *}
    enrich-batch-size: ${STEAM_ENRICH_BATCH_SIZE:1}
    enrich-interval-ms: ${STEAM_ENRICH_INTERVAL_MS:1500}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

logging:
  level:
    root: INFO
    io.github.kottzi.gamepicker: DEBUG
